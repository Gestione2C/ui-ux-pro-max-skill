<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accedi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
          colors: {
            primary: '#2563EB',
            secondary: '#3B82F6',
            accent: '#EA580C',
            surface: '#F8FAFC',
            ink: '#1E293B',
            muted: '#E9EFF8',
            'muted-fg': '#475569',
            line: '#E2E8F0',
            danger: '#DC2626'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-surface font-sans text-ink antialiased">
  <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-10">
    <!-- Sfondo vibrante per l'effetto glassmorphism -->
    <div aria-hidden="true" class="pointer-events-none absolute inset-0">
      <div class="absolute -left-24 -top-24 h-96 w-96 rounded-full bg-secondary/40 blur-3xl"></div>
      <div class="absolute -bottom-32 -right-20 h-96 w-96 rounded-full bg-accent/25 blur-3xl"></div>
      <div class="absolute left-1/2 top-1/3 h-72 w-72 -translate-x-1/2 rounded-full bg-primary/20 blur-3xl"></div>
    </div>

    <section aria-labelledby="login-title"
      class="relative w-full max-w-md rounded-3xl border border-white/60 bg-white/70 p-8 shadow-xl shadow-primary/10 backdrop-blur-xl sm:p-10">
      <header class="mb-8 text-center">
        <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-2xl bg-primary text-white shadow-lg shadow-primary/30">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1 id="login-title" class="text-2xl font-bold tracking-tight">Bentornato</h1>
        <p class="mt-2 text-sm text-muted-fg">Accedi al tuo account per continuare</p>
      </header>

      <form id="login-form" class="space-y-5" novalidate>
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium">Email</label>
          <div class="relative">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-muted-fg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>
            </svg>
            <input id="email" name="email" type="email" autocomplete="email" required
              aria-describedby="email-error"
              placeholder="nome@azienda.it"
              class="h-11 w-full rounded-xl border border-line bg-white/80 pl-10 pr-3 text-sm text-ink placeholder:text-muted-fg/70 transition-colors duration-200 hover:border-secondary focus-visible:border-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 aria-[invalid=true]:border-danger">
          </div>
          <p id="email-error" role="alert" class="mt-1.5 hidden text-sm text-danger"></p>
        </div>

        <div>
          <div class="mb-1.5 flex items-center justify-between">
            <label for="password" class="block text-sm font-medium">Password</label>
            <a href="#" class="cursor-pointer rounded text-sm font-medium text-primary transition-colors duration-200 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">Dimenticata?</a>
          </div>
          <div class="relative">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-muted-fg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
            </svg>
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8"
              aria-describedby="password-error"
              placeholder="••••••••"
              class="h-11 w-full rounded-xl border border-line bg-white/80 pl-10 pr-12 text-sm text-ink placeholder:text-muted-fg/70 transition-colors duration-200 hover:border-secondary focus-visible:border-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 aria-[invalid=true]:border-danger">
            <button type="button" id="toggle-pw" aria-label="Mostra password" aria-pressed="false"
              class="absolute right-1 top-1/2 flex h-10 w-10 -translate-y-1/2 cursor-pointer items-center justify-center rounded-lg text-muted-fg transition-colors duration-200 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p id="password-error" role="alert" class="mt-1.5 hidden text-sm text-danger"></p>
        </div>

        <label class="flex cursor-pointer items-center gap-2.5 text-sm text-muted-fg">
          <input type="checkbox" name="remember" class="h-4 w-4 cursor-pointer rounded border-line text-primary focus-visible:ring-2 focus-visible:ring-primary/40">
          Ricordami su questo dispositivo
        </label>

        <button type="submit" id="submit"
          class="flex h-12 w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-accent text-sm font-semibold text-black shadow-lg shadow-accent/30 transition duration-200 hover:bg-orange-500 hover:shadow-accent/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70 motion-safe:active:scale-[0.98]">
          <svg id="spinner" class="hidden h-4 w-4 motion-safe:animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/>
            <path d="M4 12a8 8 0 0 1 8-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          </svg>
          <span id="submit-label">Accedi</span>
        </button>
        <p id="form-status" role="status" class="min-h-5 text-center text-sm text-muted-fg"></p>
      </form>

      <div class="my-6 flex items-center gap-4 text-xs uppercase tracking-wider text-muted-fg" aria-hidden="true">
        <span class="h-px flex-1 bg-line"></span>oppure<span class="h-px flex-1 bg-line"></span>
      </div>

      <button type="button"
        class="flex h-11 w-full cursor-pointer items-center justify-center gap-2.5 rounded-xl border border-line bg-white/80 text-sm font-medium transition-colors duration-200 hover:border-secondary hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
        <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/>
          <path fill="#34A853" d="M12 23c3 0 5.4-1 7.2-2.7l-3.5-2.7c-1 .7-2.2 1-3.7 1-2.8 0-5.2-1.9-6-4.5H2.4v2.800A11 11 0 0 0 12 23z"/>
          <path fill="#FBBC05" d="M6 14.100a6.600 6.600 0 0 1 0-4.200V7.100H2.400a11 11 0 0 0 0 9.800L6 14.100z"/>
          <path fill="#EA4335" d="M12 5.400c1.600 0 3.100.6 4.200 1.700l3.100-3.100A11 11 0 0 0 2.400 7.100L6 9.900c.8-2.600 3.200-4.500 6-4.500z"/>
        </svg>
        Continua con Google
      </button>

      <p class="mt-8 text-center text-sm text-muted-fg">
        Non hai un account?
        <a href="#" class="cursor-pointer rounded font-semibold text-primary transition-colors duration-200 hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">Registrati</a>
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const toggle = document.getElementById('toggle-pw');
    const status = document.getElementById('form-status');

    toggle.addEventListener('click', () => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-pressed', String(show));
      toggle.setAttribute('aria-label', show ? 'Nascondi password' : 'Mostra password');
    });

    function setError(input, msg) {
      const el = document.getElementById(input.id + '-error');
      el.textContent = msg;
      el.classList.toggle('hidden', !msg);
      input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      setError(email, email.validity.valid ? '' : 'Inserisci un indirizzo email valido.');
      setError(password, password.validity.valid ? '' : 'La password deve avere almeno 8 caratteri.');
      if (!form.checkValidity()) { (email.validity.valid ? password : email).focus(); return; }

      const btn = document.getElementById('submit');
      btn.disabled = true;
      document.getElementById('spinner').classList.remove('hidden');
      document.getElementById('submit-label').textContent = 'Accesso in corso…';
      status.textContent = '';
      // Sostituire con la chiamata reale di autenticazione
      setTimeout(() => {
        btn.disabled = false;
        document.getElementById('spinner').classList.add('hidden');
        document.getElementById('submit-label').textContent = 'Accedi';
        status.textContent = 'Accesso effettuato con successo.';
      }, 1200);
    });
  </script>
</body>
</html>
